# Phase 1 — the whole vertical slice in one command: `docker compose up`.
# Same images run unchanged on kind/Helm later ("same app runs at every stage").
name: vortex

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: vortex
      POSTGRES_DB: vortex # maintenance db; per-service dbs created by init script
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortex"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory:
    build:
      context: ../..
      dockerfile: services/inventory/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://vortex:vortex@postgres:5432/inventory
    # migrate + seed, then serve.
    command: ["sh", "-c", "bun run db:migrate && bun run db:seed && bun src/index.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  orders:
    build:
      context: ../..
      dockerfile: services/orders/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://vortex:vortex@postgres:5432/orders
      INVENTORY_URL: http://inventory:3000
    # migrate, then serve.
    command: ["sh", "-c", "bun run db:migrate && bun src/index.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      inventory:
        condition: service_healthy
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    environment:
      PORT: 3000
      ORDERS_URL: http://orders:3000
    depends_on:
      orders:
        condition: service_healthy
    # the system's single public entry point.
    ports:
      - "8080:3000"

volumes:
  pgdata:
