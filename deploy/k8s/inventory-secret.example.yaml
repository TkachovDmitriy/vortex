# Template — copy to inventory-secret.yaml and set real values (that file is gitignored).
# Per-service DB connection string (inventory connects as its own least-privilege user).
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secret
  namespace: vortex
type: Opaque
stringData:
  DATABASE_URL: "postgres://inventory_app:CHANGEME@postgres:5432/inventory"
