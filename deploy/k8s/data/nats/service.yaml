# NATS headless Service — stable in-cluster DNS (nats:4222) for producers/consumers.
# clusterIP: None (headless) like Postgres: DNS resolves straight to the pod, the
# right model for a StatefulSet. Clients connect via NATS_URL=nats://nats:4222.
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: vortex
  labels:
    app: nats
spec:
  clusterIP: None
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
