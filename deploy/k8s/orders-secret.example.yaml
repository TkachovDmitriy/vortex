# Template — copy to orders-secret.yaml and set real values (that file is gitignored).
# Per-service DB connection string (orders connects as its own least-privilege user).
apiVersion: v1
kind: Secret
metadata:
  name: orders-secret
  namespace: vortex
type: Opaque
stringData:
  DATABASE_URL: "postgres://orders_app:CHANGEME@postgres:5432/orders"
