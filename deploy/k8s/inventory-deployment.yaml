apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: vortex
  labels:
    app: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      initContainers:
        - name: migrate
          image: vortex-inventory:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "bun src/db/migrate.ts && bun src/db/seed.ts"]
          envFrom:
            - secretRef:
                name: inventory-secret
      containers:
        - name: inventory
          image: vortex-inventory:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: inventory-config
            - secretRef:
                name: inventory-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
