# HTTPRoute — vortex.local/ → gateway Service:3000. App-owned. ADR-013.
# Scaffold: fill the TODO(you) row.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-route
  namespace: vortex
spec:
  parentRefs:
    - name: "gateway" # TODO(you): the Gateway metadata.name from gateway.yaml — attaches this route to it
  hostnames:
    - vortex.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gateway # the existing gateway Service (services/gateway/service.yaml)
          port: 3000
