# Analytics Deployment — consumes order.created from NATS. NO Service: nothing
# connects TO it; it dials NATS outbound. No DB → no initContainer / no secretRef.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: vortex
  labels:
    app: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: vortex-analytics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004 # health/metrics server only — NOT exposed via a Service
          envFrom:
            - configMapRef:
                name: analytics-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 3
            periodSeconds: 5
