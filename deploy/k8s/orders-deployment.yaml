apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: vortex
  labels:
    app: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      initContainers:
        - name: migrate
          image: vortex-orders:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "bun src/db/migrate.ts"]
          envFrom:
            - secretRef:
                name: orders-secret
      containers:
        - name: orders
          image: vortex-orders:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: orders-config
            - secretRef:
                name: orders-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
