# ── deployment values ──
replicas: 1
image:
  repository: vortex-inventory
  tag: latest
  pullPolicy: IfNotPresent
port: 3000

# ── flips on the secretRef in the main container ──
secret: true

# ── Service ──
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# ── initContainer — migrate + seed, passed through verbatim ──
initContainers:
  - name: migrate
    image: vortex-inventory
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "bun src/db/migrate.ts && bun src/db/seed.ts"]
    envFrom:
      - secretRef:
          name: inventory-secret

readinessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 3
  periodSeconds: 5

# ── config values (the ConfigMap data) ──
config:
  PORT: "3000"
