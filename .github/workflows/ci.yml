name: CI

# typecheck + per-service image build + Trivy scan, then push to ECR on develop.
# AWS auth is keyless via GitHub OIDC (no static keys) — see ADR-021.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 709569057692.dkr.ecr.eu-central-1.amazonaws.com # account id is IAM-gated, not a secret (ADR-017/019)
  CI_ROLE_ARN: arn:aws:iam::709569057692:role/vortex-dev-ci-ecr-push # = `tofu output ci_role_arn`

jobs:
  quality:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3" # match the Dockerfiles (oven/bun:1.3-slim)
      - run: bun install --frozen-lockfile # fails if bun.lock is stale (like `npm ci`)
      - run: bun run typecheck # `tsc --noEmit` across every workspace (--filter '*')
      # TODO: add `bun test` once services have tests; add a lint step once configured.

  build-scan:
    name: build + scan + push
    runs-on: ubuntu-latest
    permissions:
      id-token: write # REQUIRED: lets the job request the OIDC JWT for AWS. Forget this → creds fail to load.
      contents: read
    strategy:
      fail-fast: false # one bad service shouldn't hide the others' results
      matrix:
        service: [gateway, orders, inventory, notifications, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build context is the REPO ROOT: the multi-stage Dockerfile copies the whole
      # Bun workspace to resolve deps. `load: true` keeps the image local so Trivy
      # (and the push below) can use it. Immutable tag = git SHA (never `latest`).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.ECR_REGISTRY }}/vortex-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Gate the push: fail on fixable HIGH/CRITICAL CVEs before anything reaches ECR.
      # Run Trivy as its official OCI image (not trivy-action) — the action's bundled
      # setup-trivy installer flakily fails downloading the binary from GitHub releases
      # (aquasecurity/trivy-action#516). The image is pulled from a registry and scans
      # the locally-loaded image via the mounted docker socket. Deterministic, no installer.
      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              --format table \
              "$ECR_REGISTRY/vortex-${{ matrix.service }}:${{ github.sha }}"

      # --- push only on develop, and only after the scan passed (keyless OIDC) ---
      - name: AWS auth (OIDC, keyless)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$ECR_REGISTRY/vortex-${{ matrix.service }}:${{ github.sha }}"

  # --- image-bump: close the CI→CD loop (GitOps) ---
  # ArgoCD watches git, not the registry. After all images are pushed, write the
  # immutable SHA tag into the umbrella chart's single knob (global.imageTag) and
  # commit it back to develop with [skip ci]. ArgoCD's git-diff then triggers the
  # rollout. Runs only on develop, only after every image has been pushed. See ADR-021.
  image-bump:
    name: bump image tag → git
    needs: build-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump commit back to develop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop # branch the bump commit off the current tip

      # ubuntu-latest ships mikefarah `yq` — no install needed.
      - name: Write SHA into global.imageTag
        run: yq -i '.global.imageTag = "${{ github.sha }}"' deploy/helm/vortex/values.yaml

      - name: Commit & push the bump
        run: |
          if git diff --quiet -- deploy/helm/vortex/values.yaml; then
            echo "imageTag already at ${{ github.sha }} — nothing to bump"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "[CI] bump image tag to ${{ github.sha }} [skip ci]"
          git push origin HEAD:develop
