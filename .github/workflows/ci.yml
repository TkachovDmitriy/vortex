name: CI

# Checks-only slice: typecheck + per-service image build + Trivy scan.
# ECR push (via OIDC) is a follow-up — this workflow never touches AWS.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# Cancel superseded runs on the same ref (saves minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3" # match the Dockerfiles (oven/bun:1.3-slim)
      # --frozen-lockfile fails if bun.lock is stale — the CI equivalent of `npm ci`.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck # runs `tsc --noEmit` across every workspace (--filter '*')
      # TODO: add `bun test` once services have tests; add a lint step once configured.

  build-scan:
    name: build + scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one bad service shouldn't hide the others' results
      matrix:
        service: [gateway, orders, inventory, notifications, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build context is the REPO ROOT (not the service dir): the multi-stage
      # Dockerfile copies the whole Bun workspace to resolve deps. `load: true`
      # puts the image in the local daemon so Trivy can scan it. No push here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: vortex-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Fail the job on fixable HIGH/CRITICAL CVEs; ignore-unfixed avoids noise
      # from vulns with no upstream patch yet.
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vortex-${{ matrix.service }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
