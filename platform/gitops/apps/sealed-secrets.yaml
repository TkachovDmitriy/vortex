# Child app — applies the committed SealedSecret CRDs into the vortex namespace.
# The sealed-secrets controller decrypts them into real Secrets in-cluster.
# sync-wave "0": these must land before the services (wave "1") that consume them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vortex-sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/TkachovDmitriy/vortex.git
    targetRevision: develop
    path: platform/gitops/sealed-secrets # plain manifests — directory source, not Helm
  destination:
    server: https://kubernetes.default.svc
    namespace: vortex
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true # own the vortex namespace here (created before services sync)
